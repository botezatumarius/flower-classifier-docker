x-gpu: &gpu
  build:
    args:
      TORCH_INDEX: https://download.pytorch.org/whl/cu130
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids: ["${GPU_ID:-0}"]
            capabilities: [gpu]

services:
  inference:
    <<: *gpu
    image: flower-inference:1.0-cuda

  trainer:
    <<: *gpu
    image: flower-trainer:1.0-cuda
